<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Guerrera Silenciosa</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #181419 0%, #0c080d 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #c2b8c5;
            --accent: #d32f2f; /* Un tono rojizo/flamenco elegante */
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .phone-container {
            width: 100%;
            max-width: 390px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 32px;
            padding: 35px 24px;
            box-sizing: border-box;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 24px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .cover-art {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 16px 35px rgba(0, 0, 0, 0.7);
            margin-bottom: 30px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        .artist {
            font-size: 16px;
            color: var(--text-muted);
            margin: 0 0 35px 0;
            font-weight: 500;
        }

        audio {
            width: 100%;
            border-radius: 50px;
            outline: none;
        }

        /* Estilización del reproductor nativo */
        audio::-webkit-media-controls-enclosure {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 50px;
        }
        
        .footer-tag {
            margin-top: 35px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.25);
            text-transform: uppercase;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- Portada vinculada directamente a tu repositorio -->
        <img class="cover-art" src="https://capibarasound00.github.io/cristina26/assets/imagen/81d076ef-d4e9-4bd9-b7d0-011a0ecbc4f8-Photo-Grid.webp" alt="Portada - La Guerrera Silenciosa">
        
        <h1>La Guerrera Silenciosa</h1>
        <p class="artist">Cristina (Flamenco v2)</p>
        
        <!-- Audio enlazado directamente a tu archivo .mp3 -->
        <audio controls controlsList="nodownload">
            <source src="https://capibarasound00.github.io/cristina26/assets/sound/Cristina%20-%20La%20Guerrera%20Silenciosa%20(Flamenco%20v2).mp3" type="audio/mpeg">
            Tu dispositivo no soporta este reproductor de audio.
        </audio>

        <div class="footer-tag">Reproductor Oficial</div>
    </div>

</body>
</html>
